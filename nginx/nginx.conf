events {}
http {
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=img:50m
                   max_size=2g inactive=7d use_temp_path=off;

  # Normalize Accept header into a small cache-key dimension
  map $http_accept $img_fmt {
    default           orig;
    "~*image/avif"    avif;
    "~*image/webp"    webp;
  }

  server {
    listen 80;
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    location /i/ {
      proxy_pass $api;
      proxy_set_header X-Img-Fmt $img_fmt;
      proxy_cache img;
      proxy_cache_key "$uri$is_args$args$img_fmt";
      proxy_cache_valid 200 7d;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
      add_header X-Cache $upstream_cache_status always;
    }

    location / {
      proxy_pass $api;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
