events {}
http {
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=img:50m
                   max_size=2g inactive=7d use_temp_path=off;

  limit_conn_zone $binary_remote_addr zone=upl:10m;

  # Trust CF-Connecting-IP only when the TCP source is the cloudflare docker
  # network (cloudflared). Requests via the published port come from elsewhere
  # and keep their real TCP address.
  set_real_ip_from 172.18.0.0/16;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;

  # Counts hits too: nginx cannot know hit/miss before the cache lookup.
  limit_req_zone $binary_remote_addr zone=imgmiss:10m rate=30r/s;
  # Brute-force protection for login/register/password change.
  limit_req_zone $binary_remote_addr zone=authreq:10m rate=10r/m;
  # General API.
  limit_req_zone $binary_remote_addr zone=apireq:10m rate=20r/s;

  # Only POSTs (server actions) are limited on the cms; empty key = not limited.
  map $request_method $post_key {
    POST    $binary_remote_addr;
    default "";
  }
  limit_req_zone $post_key zone=cmsauth:10m rate=10r/m;

  # Normalize Accept header into a small cache-key dimension
  map $http_accept $img_fmt {
    default           orig;
    "~*image/avif"    avif;
    "~*image/webp"    webp;
  }

  server {
    listen 80 default_server;
    server_name cdn.cocahome.click;
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    location /i/ {
      proxy_pass $api;
      proxy_set_header X-Img-Fmt $img_fmt;
      proxy_cache img;
      proxy_cache_key "$uri$is_args$args$img_fmt";
      proxy_cache_valid 200 7d;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
      add_header X-Cache $upstream_cache_status always;
      limit_req zone=imgmiss burst=20 nodelay;
      limit_req_status 429;
    }

    location = /me/events {
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location = /upload {
      limit_conn upl 3;
      limit_conn_status 429;
      proxy_pass $api;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ASP.NET routing is case-insensitive and accepts a trailing slash, so exact
    # locations could be bypassed with /login/ or /LOGIN.
    location ~* ^/(register|login|me/password)/?$ {
      limit_req zone=authreq burst=5 nodelay;
      limit_req_status 429;
      proxy_pass $api;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      limit_req zone=apireq burst=40 nodelay;
      limit_req_status 429;
      proxy_pass $api;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name cms.cocahome.click;
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=10s;
    set $admin http://admin:3000;

    # SSE: no buffering, long read timeout
    location = /api/me/events {
      proxy_pass $admin;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_connect_timeout 2s;
    }

    # Server actions for login/register/account are POSTs to the page URL
    location ~ ^/(login|register|account)$ {
      limit_req zone=cmsauth burst=5 nodelay;
      limit_req_status 429;
      proxy_pass $admin;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_connect_timeout 2s;
    }

    location / {
      proxy_pass $admin;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_connect_timeout 2s;
    }
  }
}
